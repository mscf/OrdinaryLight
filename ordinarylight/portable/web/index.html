<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Portable scientific volume</title>
<style>body{font:15px system-ui;background:#121721;color:#e7edf6;margin:24px;max-width:1100px}main{display:flex;gap:24px;flex-wrap:wrap}canvas{width:512px;height:512px;max-width:100%;background:#080b12}aside{width:340px}label{display:flex;justify-content:space-between;gap:12px;margin:9px 0}input,select{width:130px}button{margin:8px 6px 8px 0}#status{white-space:pre-wrap;color:#afd2ff}small{color:#a8b4c5}h1{font-size:24px}</style>
<h1>Scientific volume</h1><p id="description"></p><main><canvas id="view" width="512" height="512" aria-label="Histogram volume"></canvas><aside><form id="controls"></form><button id="save">Save view</button><button id="restore">Restore view</button><input id="file" type="file" accept="application/json" hidden><p id="status" role="status">Preparing…</p></aside></main>
<section id="trace-panel" hidden><h2>Voltage trace</h2><p id="trace-label"></p><canvas id="trace" width="900" height="240" style="width:900px;height:240px" aria-label="Membrane voltage versus time"></canvas></section>
<script type="module">
import {PortableViewer,fetchPackage} from './runtime.js';
const status=document.querySelector('#status'), canvas=document.querySelector('canvas'), controls=document.querySelector('#controls');
let viewer;
const showError=e=>{status.textContent=e.message;console.error(e);};
async function reprepare(snapshot,changes){
 status.textContent='Preparing replacement…';
 const response=await fetch('/prepare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({snapshot,changes})});
 const body=await response.json();if(!response.ok)throw new Error(body.error);return fetchPackage(body.url);
}
async function change(value){try{await viewer.update(value);buildControls();status.textContent='Ready';}catch(e){showError(e);buildControls();}}
function control(label,value,handler,{min,max,step='any',choices}={}){
 const row=document.createElement('label');const text=document.createElement('span');text.textContent=label;row.append(text);
 const input=document.createElement(choices?'select':'input');
 if(choices){for(const choice of choices){const option=document.createElement('option');option.textContent=choice;option.value=choice;input.append(option);}input.value=String(value);}
 else {input.type=typeof value==='boolean'?'checkbox':'number';if(input.type==='checkbox')input.checked=value;else input.value=value;if(min!=null)input.min=min;if(max!=null)input.max=max;input.step=step;}
 input.addEventListener('change',()=>handler(choices?input.value:input.type==='checkbox'?input.checked:Number(input.value)));row.append(input);controls.append(row);
}
function buildControls(){
 controls.replaceChildren();const r=viewer.runtime,m=r.manifest;
 document.querySelector('#description').textContent=`${m.science.x.name} × ${m.science.y.name}; ${m.science.output}${m.science.units?' ('+m.science.units+')':''}. Density: counts per bin; ${m.science.samples_per_cell} samples per grid point.`;
 const title=document.createElement('h2');title.textContent='Model';controls.append(title);
 for(const f of m.parameters.fields){if([m.science.x.name,m.science.y.name].includes(f.name))continue;
 control(f.name,r.values[f.name],v=>change({parameters:{[f.name]:v}}),{min:f.range?.[0],max:f.range?.[1],step:f.type==='f32'?'any':1});}
 const p=r.presentation;
 control('Output',m.science.output,v=>change({preparation:{output:v}}),{choices:Object.keys(m.science.source.graph.outputs)});
 const numeric=m.parameters.fields.filter(f=>f.update==='live'&&f.type!=='bool').map(f=>f.name);
 control('X axis',m.science.x.name,v=>change({preparation:{x:v,x_range:null}}),{choices:numeric});
 control('Y axis',m.science.y.name,v=>change({preparation:{y:v,y_range:null}}),{choices:numeric});
 for(const [label,key,min,max] of [['Grid size','resolution',2,64],['Bins','bins',2,512]])control(label,m.science.preparation[key],v=>change({preparation:{[key]:v}}),{min,max,step:1});
 const display=document.createElement('h2');display.textContent='View';controls.append(display);
 control('Mode',p.mode,v=>change({presentation:{mode:v}}),{choices:['volume','slice']});
 for(const [label,key,min,max] of [['Opacity','opacity',0,10],['Display maximum','maximum',.001,null],['Slice position','slice_z',0,1],['Yaw','yaw',-10,10],['Pitch','pitch',-1.5,1.5],['Distance','radius',2,100]])control(label,p[key],v=>change({presentation:{[key]:v}}),{min,max});
 drawTrace(r).catch(e=>{if(!r.closed)showError(e);});
}
async function drawTrace(r){
 const panel=document.querySelector('#trace-panel'),s=r.manifest.science;
 panel.hidden=s.sample_axis!=='time';if(panel.hidden)return;
 const values=new Float32Array(await r.read(s.output));if(r!==viewer.runtime||r.closed)return;
 const nx=s.x.samples.length,ix=Math.floor(nx/2),iy=Math.floor(s.y.samples.length/2),n=s.samples_per_cell;
 const trace=values.subarray((iy*nx+ix)*n,(iy*nx+ix+1)*n), c=document.querySelector('#trace'),ctx=c.getContext('2d');
 const left=55,top=15,w=c.width-left-15,h=c.height-top-35,lo=s.edges[0],hi=s.edges.at(-1);
 ctx.fillStyle='#080b12';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#66758b';ctx.strokeRect(left,top,w,h);
 ctx.fillStyle='#e7edf6';ctx.font='13px system-ui';ctx.fillText(`${hi} ${s.units}`,2,top+8);ctx.fillText(`${lo}`,2,top+h);
 ctx.fillText(`${s.sampling.start} – ${(s.sampling.start+(n-1)*s.sampling.step).toFixed(3)} ${s.sampling.units}`,left,top+h+25);
 ctx.strokeStyle='#66d9cf';ctx.beginPath();for(let i=0;i<n;i++){const x=left+i*w/Math.max(1,n-1),y=top+h*(hi-trace[i])/(hi-lo);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();
 document.querySelector('#trace-label').textContent=`Central grid point: ${s.x.name}=${s.x.samples[ix]}, ${s.y.name}=${s.y.samples[iy]}. ${s.output} (${s.units}); post-step samples. This trace preview reads back the vector; the volume uses GPU-resident counts.`;
}
try {
 viewer=await PortableViewer.create(await fetchPackage(new URLSearchParams(location.search).get('package')||'/initial/manifest.json'),{canvas,onReprepare:reprepare});
 viewer.runtime.compute();viewer.runtime.render();buildControls();status.textContent='Ready';globalThis.viewer=viewer;globalThis.ready=true;
} catch(e){showError(e);globalThis.startError=e.stack;}
document.querySelector('#save').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(viewer.runtime.snapshot(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='view.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.querySelector('#restore').onclick=()=>document.querySelector('#file').click();
document.querySelector('#file').onchange=async e=>{try{viewer.runtime.restore(JSON.parse(await e.target.files[0].text()));viewer.runtime.render();buildControls();status.textContent='View restored';}catch(error){showError(error);}};
window.addEventListener('pagehide',()=>viewer?.close());
</script></html>
