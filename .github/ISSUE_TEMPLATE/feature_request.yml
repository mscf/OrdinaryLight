name: Feature request
description: Propose a renderer or API capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the application need rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Desired API or behavior
      description: Include a short Python example when possible.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

