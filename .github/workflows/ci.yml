name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      ORDINARYLIGHT_RUN_GPU_GATES: "0"
      ORDINARYLIGHT_RUN_PERFORMANCE_GATES: "0"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Vulkan loader for module collection
        run: sudo apt-get update && sudo apt-get install --yes libvulkan1
      - name: Install unit-test dependencies
        # Vulkan configuration, layout, and shader-contract tests are useful
        # without a GPU, but importing those modules requires the optional
        # Python Vulkan binding. Actual device and performance gates remain
        # disabled here and run only on the self-hosted GPU workflow.
        run: python -m pip install --upgrade pip && python -m pip install -e '.[vulkan]'
      - name: Run hardware-independent tests
        run: python -m unittest discover -s tests -v

  package:
    name: Validate distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Verify wheel contents
        run: python scripts/verify_wheel.py dist/*.whl
      - name: Test wheel as a core-only consumer
        run: |
          python -m venv /tmp/ordinarylight-consumer
          /tmp/ordinarylight-consumer/bin/python -m pip install dist/*.whl
          /tmp/ordinarylight-consumer/bin/python scripts/test_wheel_consumer.py
      - uses: actions/upload-artifact@v4
        with:
          name: ordinarylight-distributions
          path: dist/
          if-no-files-found: error
