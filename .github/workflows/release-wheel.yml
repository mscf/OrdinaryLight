name: Build release wheel

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  wheel:
    name: Build and attach wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out pinned Ordinary Shade compiler
        uses: actions/checkout@v4
        with:
          repository: mscf/OrdinaryShade
          ref: 98d12db5dfef408b32134bf5aa0c4a2798eab247
          path: compatibility/OrdinaryShade
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Require release tag to match package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: python scripts/check_release_version.py "$RELEASE_TAG"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools
          cargo install naga-cli --version 30.0.0 --locked
          python -m pip install --upgrade build twine
          python -m pip install -e compatibility/OrdinaryShade -e .
      - name: Compile packaged raster shaders from Python sources
        run: |
          python scripts/generate_raster_artifacts.py
          python scripts/generate_raster_artifacts.py --check
          python scripts/generate_denoiser_artifacts.py
          python scripts/generate_denoiser_artifacts.py --check
      - name: Build distributions
        run: python -m build
      - name: Validate wheel
        run: python -m twine check dist/* && python scripts/verify_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: ordinarylight-${{ github.event.release.tag_name || github.ref_name }}-wheel
          path: dist/*
          if-no-files-found: error
      - name: Attach wheel to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "OrdinaryLight $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
