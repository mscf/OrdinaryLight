[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordinarylight"
version = "0.3.5"
description = "A Pythonic, general-purpose hardware-accelerated path tracing renderer"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["rendering", "path-tracing", "ray-tracing", "vulkan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "numpy>=1.24",
    "ordinaryshade>=0.1.0a0",
    "Pillow>=10.0",
    "pygltflib>=1.16.5",
]

[project.optional-dependencies]
vulkan = ["vulkan==1.3.275.1"]
gui = ["dearpygui>=2.0"]
window = ["vulkan==1.3.275.1", "glfw>=2.8", "PyOpenGL>=3.1"]
webgpu = ["wgpu>=0.32"]
qt = ["vulkan==1.3.275.1", "PySide6>=6.7", "glfw>=2.8"]
video-gpu = [
    "vulkan==1.3.275.1",
    "cuda-bindings>=13.0",
    "PyNvVideoCodec>=2.2",
]
dev = ["build>=1.2", "twine>=5.1"]

[project.scripts]
ordinarylight-workbench = "ordinarylight.integrations.qt_workbench:main"
ordinarylight-raster-workbench = "ordinarylight.integrations.raster_workbench:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ordinarylight*"]

[tool.setuptools.package-data]
ordinarylight = [
    "shaders/*.spv", "shaders/*.comp", "shaders/*.glsl",
    "shaders/transport_v1/*.glsl",
    "shaders/*.json", "shaders/*.wgsl", "shaders/*.rgen", "shaders/*.rmiss",
    "showcases/catalog/*.py", "showcases/catalog/*.md",
]
