[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordinarylight-transport-demo"
version = "0.3.0"
description = "An external client of OrdinaryLight's non-camera transport API"
requires-python = ">=3.11"
dependencies = ["ordinarylight[vulkan]", "ordinaryshade>=0.1.0a0", "numpy>=1.26", "Pillow>=10"]

[project.optional-dependencies]
present = ["ordinarylight[window]"]

[project.scripts]
ordinarylight-transport-demo = "ordinarylight_transport_demo.__main__:main"
ordinarylight-animated-grid = "ordinarylight_transport_demo.animated_grid:main"

[tool.setuptools.packages.find]
where = ["src"]
